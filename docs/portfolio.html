<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body>
  <div class="background-video" aria-hidden="true">
    <video
      class="background-video__element"
      autoplay
      muted
      loop
      playsinline
      aria-hidden="true"
    >
      <source src="assets/videos/cyber-background.mp4" type="video/mp4">
    </video>
  </div>
  <div class="background-video__overlay" aria-hidden="true"></div>

  <header id="navbar"></header>

  <main>
    <section class="py-5">

          <h2 class="fw-bold section-title">My Work</h2>
          <p class="section-subtitle">A selection of projects that showcase my skills and learning journey</p>
        </div>

          <div class="col-12 text-center py-5">

            <p class="text-muted">Loading projects...</p>
          </div>
        </div>
      </div>

    <section class="py-5 bg-secondary bg-opacity-10">

        <h2 class="fw-bold mb-3 mt-3">Interested in Working Together?</h2>

        <a href="contact.html" class="btn btn-primary btn-lg px-5">Start a Conversation</a>
      </div>
    </section>

  <footer id="footer"></footer>

  <script src="js/main.js"></script>
